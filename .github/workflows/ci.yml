name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" --no-cache-dir
        
    - name: Code quality (non-blocking)
      continue-on-error: true
      run: |
        black --check --line-length 120 app/ tests/
        isort --check-only --profile black app/ tests/
        flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503
        
    - name: Run core and model-free MLX regression tests
      env:
        BACKEND: torch
        LOG_LEVEL: ERROR
        CI: true
        PYTHONPATH: .
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: |
        pytest -q --tb=short \
          tests/test_ci_quick.py \
          tests/test_health_reranker_info.py \
          tests/test_reranker_activation.py \
          tests/test_mlx_embedding_tokenization.py \
          tests/test_mlx_reranker_safety.py \
          tests/test_embedding_context_backends.py \
          tests/test_embedding_context_factory.py \
          tests/test_embedding_context_preprocessing.py \
          tests/test_embedding_context_settings.py \
          tests/test_embedding_limits.py \
          tests/test_reranker_settings.py \
          tests/test_reranker_api_safety.py
        
    - name: Test imports
      run: |
        # Test that core modules can be imported without errors
        python -c "from app.main import app; print('✅ App import successful')"
        python -c "from app.backends.factory import BackendFactory; print('✅ Backend factory import successful')"
        python -c "from app.models.requests import EmbedRequest; print('✅ Models import successful')"
